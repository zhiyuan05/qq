<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>聊天机器人管理面板</title>
  <link rel="stylesheet" href="/static/admin.css">
  <script src="/static/admin.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>

  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.7 12 3l9 7.7"/><path d="M5.5 9.4V21h13V9.4"/><path d="M9.5 21v-6h5v6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 14.5a4 4 0 0 1-4 4H8l-5 2.8V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 9h8M8 13h5"/></symbol>
    <symbol id="i-sessions" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="m21 15.5-4.2-4.2L7 21"/></symbol>
    <symbol id="i-persona" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-stickers" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14.2s1.4 1.9 4 1.9 4-1.9 4-1.9"/><path d="M9 9h.01M15 9h.01"/></symbol>
    <symbol id="i-usage" viewBox="0 0 24 24"><path d="M4 3v18h17"/><path d="m7 14 4-4 3.5 3.5L20 8"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="10" r="2"/><circle cx="20" cy="14" r="2"/></symbol>
    <symbol id="i-logs" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h4M9 13h6M9 17h6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
  </svg>

  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="聊天机器人管理面板首页">
        <span class="brand-mark" aria-hidden="true">Q</span>
        <span class="brand-text">
          <strong>QQ Bot</strong>
          <small>管理面板</small>
        </span>
      </a>

      <nav class="side-nav" aria-label="主要导航">
        <a href="/" data-nav="home"><svg class="icon"><use href="#i-home"></use></svg><span>首页</span></a>
        <a href="/chat" data-nav="chat"><svg class="icon"><use href="#i-chat"></use></svg><span>对话</span></a>
        <a href="/sessions" data-nav="sessions"><svg class="icon"><use href="#i-sessions"></use></svg><span>会话</span></a>
        <a href="/cards" data-nav="cards"><svg class="icon"><use href="#i-cards"></use></svg><span>角色</span></a>
        <a href="/persona" data-nav="persona"><svg class="icon"><use href="#i-persona"></use></svg><span>人格</span></a>
        <a href="/stickers" data-nav="stickers"><svg class="icon"><use href="#i-stickers"></use></svg><span>表情</span></a>
        <a href="/usage" data-nav="usage"><svg class="icon"><use href="#i-usage"></use></svg><span>用量</span></a>
        <a href="/settings" data-nav="settings"><svg class="icon"><use href="#i-settings"></use></svg><span>设置</span></a>
        <a href="/logs" data-nav="logs"><svg class="icon"><use href="#i-logs"></use></svg><span>日志</span></a>
      </nav>

      <div class="sidebar-foot">
        <span class="status-dot" aria-hidden="true"></span>
        <span>本地管理 · 令牌保护</span>
      </div>
    </aside>

    <div class="main">
      <header class="header">
        <div class="header-row">
          <div class="header-text">
            <a id="back-link" class="back-link hidden" href="/">返回</a>
            <h1 id="page-title">聊天机器人</h1>
            <p id="page-subtitle" class="subtitle" aria-live="polite">正在加载…</p>
          </div>
          <button id="theme-toggle" class="icon-button" type="button" aria-label="切换深色模式">🌙</button>
        </div>
      </header>

      <main id="app" class="container" tabindex="-1">
        <div class="loading" role="status">正在加载…</div>
      </main>
    </div>
  </div>

  <nav id="main-nav" class="nav" aria-label="移动端导航">
    <a href="/" data-nav="home"><svg class="icon"><use href="#i-home"></use></svg><span>首页</span></a>
    <a href="/chat" data-nav="chat"><svg class="icon"><use href="#i-chat"></use></svg><span>对话</span></a>
    <a href="/sessions" data-nav="sessions"><svg class="icon"><use href="#i-sessions"></use></svg><span>会话</span></a>
    <a href="/cards" data-nav="cards"><svg class="icon"><use href="#i-cards"></use></svg><span>角色</span></a>
    <button id="nav-more-toggle" class="nav-more-button" type="button" aria-expanded="false" aria-controls="nav-more">
      <svg class="icon"><use href="#i-more"></use></svg><span>更多</span>
    </button>
  </nav>

  <div id="nav-backdrop" class="nav-backdrop"></div>
  <div id="nav-more" class="nav-more" aria-label="更多页面" aria-hidden="true">
    <a href="/persona" data-nav="persona"><svg class="icon"><use href="#i-persona"></use></svg><span>人格</span></a>
    <a href="/stickers" data-nav="stickers"><svg class="icon"><use href="#i-stickers"></use></svg><span>表情</span></a>
    <a href="/usage" data-nav="usage"><svg class="icon"><use href="#i-usage"></use></svg><span>用量</span></a>
    <a href="/settings" data-nav="settings"><svg class="icon"><use href="#i-settings"></use></svg><span>设置</span></a>
    <a href="/logs" data-nav="logs"><svg class="icon"><use href="#i-logs"></use></svg><span>日志</span></a>
  </div>

  <noscript><p class="noscript">管理面板需要启用 JavaScript。</p></noscript>
</body>
</html>
