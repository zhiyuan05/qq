<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="聊天机器人">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2f2f4"/>
      <stop offset="1" stop-color="#a9d3d9"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbd4da"/>
      <stop offset="1" stop-color="#f2a9b8"/>
    </linearGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd3df"/>
      <stop offset="1" stop-color="#5fb3c4"/>
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="188" fill="url(#tile)"/>
  <rect x="34" y="34" width="956" height="956" rx="178" fill="none" stroke="#7fb9c2" stroke-width="10" opacity=".5"/>

  <!-- ears -->
  <path d="M302 452 L206 156 Q198 124 230 136 L466 254 Z" fill="#faf3e7" stroke="#2f3352" stroke-width="24" stroke-linejoin="round"/>
  <path d="M722 452 L818 156 Q826 124 794 136 L558 254 Z" fill="#faf3e7" stroke="#2f3352" stroke-width="24" stroke-linejoin="round"/>
  <path d="M322 396 L258 218 L400 292 Z" fill="url(#ear)" opacity=".9"/>
  <path d="M702 396 L766 218 L624 292 Z" fill="url(#ear)" opacity=".9"/>

  <!-- head -->
  <ellipse cx="512" cy="574" rx="272" ry="242" fill="#faf3e7" stroke="#2f3352" stroke-width="24"/>

  <!-- closed eyes -->
  <path d="M342 560 q46 38 92 0" fill="none" stroke="#2f3352" stroke-width="22" stroke-linecap="round"/>
  <path d="M590 560 q46 38 92 0" fill="none" stroke="#2f3352" stroke-width="22" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="318" cy="644" rx="44" ry="25" fill="#f6a8b6" opacity=".55"/>
  <ellipse cx="706" cy="644" rx="44" ry="25" fill="#f6a8b6" opacity=".55"/>

  <!-- nose + mouth -->
  <path d="M496 618 q16 -15 32 0 q-16 21 -32 0 Z" fill="#2f3352"/>
  <path d="M512 640 q0 22 -25 27 M512 640 q0 22 25 27" fill="none" stroke="#2f3352" stroke-width="14" stroke-linecap="round"/>

  <!-- bow -->
  <g transform="translate(786 252) rotate(14) scale(1.08)">
    <path d="M0 0 C-58 -46 -106 -6 -74 34 L0 27 Z" fill="url(#bow)" stroke="#2f3352" stroke-width="16" stroke-linejoin="round"/>
    <path d="M0 0 C58 -46 106 -6 74 34 L0 27 Z" fill="url(#bow)" stroke="#2f3352" stroke-width="16" stroke-linejoin="round"/>
    <circle cx="0" cy="15" r="21" fill="#f6b64a" stroke="#2f3352" stroke-width="13"/>
  </g>

  <!-- sleep marks -->
  <text x="168" y="372" fill="#2f3352" font-family="Arial, 'PingFang SC', sans-serif" font-size="82" font-weight="700" opacity=".5">z</text>
  <text x="108" y="266" fill="#2f3352" font-family="Arial, 'PingFang SC', sans-serif" font-size="56" font-weight="700" opacity=".34">z</text>
</svg>
