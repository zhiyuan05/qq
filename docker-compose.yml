services:
  # QQ机器人后端 (NapCat / OneBot v11)
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: ${CHATBOT_CONTAINER_PREFIX:-}napcat
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHATBOT_ONEBOT_PORT:-3001}:3001" # 本机调试 OneBot API / WebSocket
      - "127.0.0.1:${NAPCAT_WEBUI_PORT:-6099}:6099" # WebUI 登录；远程使用 SSH 隧道
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
      - ACCOUNT=${CHATBOT_QQ_ACCOUNT:-你的QQ号}
    volumes:
      - ./data/napcat:/app/.config/QQ
      # 持久化 WebUI / OneBot 网络配置，重建容器后不用重新配置
      - ./data/napcat-config:/app/napcat/config
      # 与 chatbot 使用相同的绝对路径，file:// 媒体才能被 NapCat 读取
      - ./data/media:/app/data/media:ro
    networks:
      - chatbot-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 聊天机器人主服务
  chatbot:
    build:
      context: .
      # 构建阶段使用宿主机网络，规避服务器 Docker 默认网桥 DNS 异常。
      network: host
      args:
        UID: ${CHATBOT_UID:-1000}
        GID: ${CHATBOT_GID:-1000}
        INSTALL_VOICE: ${CHATBOT_INSTALL_VOICE:-false}
    container_name: ${CHATBOT_CONTAINER_PREFIX:-}chatbot
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${CHATBOT_WEB_PORT:-8080}:8080" # 管理面板；公网仅经 TLS 反向代理
    env_file:
      - .env
    environment:
      - TMPDIR=/app/data/tmp
      - HF_HOME=/app/data/hf
      - WHISPER_CACHE_DIR=/app/data/whisper
      - CHATBOT_VOICE_ENABLED=${CHATBOT_VOICE_ENABLED:-false}
      - CHATBOT_GROUPS_PATH=${CHATBOT_GROUPS_PATH:-data/groups.json}
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./characters:/app/characters
      # 前端资源热更新：改模板/静态文件后只需重启容器
      - ./web/templates:/app/web/templates:ro
      - ./web/static:/app/web/static:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      napcat:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - chatbot-net
    deploy:
      resources:
        limits:
          memory: ${CHATBOT_MEMORY_LIMIT:-1536M}

networks:
  chatbot-net:
    driver: bridge
