[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot"
version = "2.4.0"
description = "QQ + Telegram 双平台、DeepSeek API 驱动的聊天机器人"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "openai>=1.12.0",
    "chromadb>=0.4.22",
    "cachetools>=5.3.0",
    "tiktoken>=0.6.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "websockets>=15.0,<18.0",
    "aiofiles>=24.0",
    "python-multipart>=0.0.9",
    "wechatpy>=1.8.18,<2.0.0",
    "cryptography>=42.0",
    "Pillow>=10.0",
]

[project.scripts]
chatbot-migrate = "database.migrate:entrypoint"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.12.0",
]
voice = [
    "faster-whisper==1.2.1",
    "av==13.1.0",
    "edge-tts>=6.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
exclude = [
    "tests",
    "tests.*",
    "build",
    "build.*",
    "dist",
    "dist.*",
    "data",
    "data.*",
]

[tool.setuptools.package-data]
characters = ["cards/*.yaml", "roles/*.md"]
styles = ["presets.yaml"]
database = ["migrations/*.sql"]
web = ["static/*.css", "static/*.js", "static/*.svg", "templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# 先将会导致运行故障的规则纳入门禁；旧代码的风格告警分阶段清理。
select = ["E9", "F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F841"]
